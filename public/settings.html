<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="settings.pageTitle">Einstellungen - Service Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1F1F1F;
      color: #eee;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #00d9ff; margin-bottom: 20px; }
    h2 { color: #c1cbcd; margin: 20px 0 10px; }
    .card {
      background: #555555ab;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
    }
    label { display: block; margin-bottom: 5px; color: #aaa; }
    input[type="text"], input[type="number"], input[type="url"], input[type="password"], select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #333;
      color: #fff;
      font-size: 14px;
    }
    input[type="file"] {
      padding: 8px;
      margin-bottom: 15px;
      border: 1px dashed #444;
      border-radius: 6px;
      background: #333;
      color: #aaa;
      font-size: 14px;
      width: 100%;
    }
    select { cursor: pointer; }
    .logo-select-wrapper { display: flex; gap: 10px; }
    .logo-select-wrapper select { flex: 1; }
    .logo-select-wrapper input { flex: 1; }
    .service-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      padding: 10px;
      background: #444;
      border-radius: 6px;
    }
    .service-row input { margin-bottom: 0; flex: 1; }
    .service-row input:first-child { max-width: 150px; }
    .service-row select { margin-bottom: 0; flex: 1; }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    .btn-primary { background: #00d9ff; color: #000; }
    .btn-danger { background: #ff4757; color: #fff; }
    .btn-success { background: #00ff88; color: #000; }
    .btn-add { background: #00d9ff; color: #000; }
    .btn-upload { display: block; margin-left: auto; }
    .btn-remove { padding: 10px 15px; }
    .nav { margin-bottom: 20px; }
    .nav a { color: #00d9ff; text-decoration: none; }
    .message {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }
    .message.success { background: #00ff8822; color: #00ff88; display: block; }
    .message.error { background: #ff475722; color: #ff4757; display: block; }
    .lang-select { position: fixed; top: 12px; right: 12px; padding: 6px; border-radius: 6px; border: 1px solid #444; background: #333; color: #fff; font-size: 14px; width: auto; margin: 0; }
  </style>
</head>
<body>
  <select id="langSelect" class="lang-select" onchange="setLang(this.value)"></select>
  <div class="container">
    <div class="nav">
      <a href="/" data-i18n="settings.back">&larr; Zurück zum Monitor</a>
    </div>
    <h1 data-i18n="settings.heading">Einstellungen</h1>
    
    <div id="message" class="message"></div>
    
    <div class="card">
      <h2 data-i18n="settings.general">Allgemein</h2>
      <label data-i18n="settings.title">Titel</label>
      <input type="text" id="title" data-i18n-placeholder="settings.titlePlaceholder" placeholder="Mein Monitor">
      
      <label data-i18n="settings.logo">Logo</label>
      <select id="logo"></select>
      
      <label data-i18n="settings.uploadLabel">Bild hochladen</label>
      <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.gif,.ico,.svg,.webp">
      <button class="btn btn-add btn-upload" data-i18n="settings.upload" onclick="uploadImage()">Bild hochladen</button>
      
      <label data-i18n="settings.username">Benutzername</label>
      <input type="text" id="username" placeholder="admin">
      
      <label data-i18n="settings.password">Passwort</label>
      <input type="password" id="password" data-i18n-placeholder="settings.passwordPlaceholder" placeholder="Passwort">
      
      <label data-i18n="settings.refresh">Refresh Interval (ms)</label>
      <input type="number" id="refreshInterval" value="30000">
      
      <label data-i18n="settings.timeout">Timeout (ms)</label>
      <input type="number" id="timeout" value="5000">
    </div>
    
    <div class="card">
      <h2 data-i18n="settings.services">Services</h2>
      <div id="services"></div>
      <button class="btn btn-add" data-i18n="settings.addService" onclick="addService()">+ Service hinzufügen</button>
    </div>
    
    <button class="btn btn-success" data-i18n="settings.save" onclick="saveConfig()">Speichern</button>
  </div>

  <script src="/i18n.js"></script>
  <script>
    let config = {};
    let images = [];
    
    async function loadImages() {
      try {
        const res = await fetch('/api/images', { credentials: 'include' });
        images = await res.json();
      } catch (e) {
        images = [];
      }
    }
    
    function createLogoSelect(selected = '') {
      let options = `<option value="">${t('settings.noLogo')}</option>`;
      images.forEach(img => {
        const selectedAttr = img === selected ? ' selected' : '';
        options += `<option value="${img}"${selectedAttr}>${img.split('/').pop()}</option>`;
      });
      return options;
    }
    
    async function loadConfig() {
      await loadImages();
      
      const res = await fetch('/api/config', { credentials: 'include' });
      if (res.status === 401) {
        window.location.href = '/login.html';
        return;
      }
      config = await res.json();
      
      document.getElementById('title').value = config.title || '';
      document.getElementById('logo').innerHTML = createLogoSelect(config.logo);
      document.getElementById('username').value = config.username || '';
      document.getElementById('password').value = '';
      window.hasAuth = config.hasAuth || false;
      updatePasswordPlaceholder();
      document.getElementById('refreshInterval').value = config.refreshInterval || 30000;
      document.getElementById('timeout').value = config.timeout || 5000;
      
      const servicesDiv = document.getElementById('services');
      servicesDiv.innerHTML = '';
      
      (config.services || []).forEach(service => {
        addService(service.name, service.url, service.logo);
      });
    }
    
    function updatePasswordPlaceholder() {
      document.getElementById('password').placeholder = window.hasAuth ? t('settings.passwordChange') : t('settings.password');
    }
    
    function addService(name = '', url = '', logo = '') {
      const div = document.createElement('div');
      div.className = 'service-row';
      div.innerHTML = `
        <input type="text" class="service-name" placeholder="${t('settings.name')}" value="${name}">
        <input type="url" placeholder="URL" value="${url}">
        <select class="logo-select">${createLogoSelect(logo)}</select>
        <button class="btn btn-danger btn-remove" onclick="this.parentElement.remove()">✕</button>
      `;
      document.getElementById('services').appendChild(div);
    }
    
    async function saveConfig() {
      const rows = document.querySelectorAll('.service-row');
      const services = [];
      rows.forEach(row => {
        const inputs = row.querySelectorAll('input');
        const logoSelect = row.querySelector('.logo-select');
        if (inputs[1].value) {
          services.push({
            name: inputs[0].value,
            url: inputs[1].value,
            logo: logoSelect ? logoSelect.value : ''
          });
        }
      });
      
      const logoSelect = document.getElementById('logo');
      const newUsername = document.getElementById('username').value;
      const newPassword = document.getElementById('password').value;
      
      const newConfig = {
        title: document.getElementById('title').value,
        logo: logoSelect.value,
        username: newUsername,
        password: newPassword || (window.hasAuth ? (config.password || '') : ''),
        refreshInterval: parseInt(document.getElementById('refreshInterval').value),
        timeout: parseInt(document.getElementById('timeout').value),
        services: services
      };
      
      const headers = { 'Content-Type': 'application/json' };
      if (window.hasAuth && newUsername && newPassword) {
        headers['Authorization'] = 'Basic ' + btoa(newUsername + ':' + newPassword);
      }
      
      try {
        const res = await fetch('/api/config', {
          method: 'POST',
          credentials: 'include',
          headers: headers,
          body: JSON.stringify(newConfig)
        });
        const result = await res.json();
        
        const msg = document.getElementById('message');
        if (result.success) {
          msg.className = 'message success';
          msg.textContent = t('settings.saved');
        } else {
          msg.className = 'message error';
          msg.textContent = t('common.error') + ': ' + result.error;
        }
      } catch (e) {
        const msg = document.getElementById('message');
        msg.className = 'message error';
        msg.textContent = t('common.error') + ': ' + e.message;
      }
    }
    
    function showMessage(type, text) {
      const msg = document.getElementById('message');
      msg.className = 'message ' + type;
      msg.textContent = text;
    }
    
    async function uploadImage() {
      const input = document.getElementById('fileInput');
      const file = input.files && input.files[0];
      if (!file) {
        showMessage('error', t('settings.selectFirst'));
        return;
      }
      try {
        const res = await fetch('/api/upload?filename=' + encodeURIComponent(file.name), {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/octet-stream' },
          body: file
        });
        const result = await res.json();
        if (result.success) {
          showMessage('success', t('settings.uploaded') + file.name);
          input.value = '';
          await loadImages();
          buildLogoSelects();
        } else {
          showMessage('error', t('common.error') + ': ' + result.error);
        }
      } catch (e) {
        showMessage('error', t('common.error') + ': ' + e.message);
      }
    }
    
    function buildLogoSelects() {
      const mainSelect = document.getElementById('logo');
      const current = mainSelect.value;
      mainSelect.innerHTML = createLogoSelect(current);
      
      document.querySelectorAll('.logo-select').forEach(sel => {
        const cur = sel.value;
        sel.innerHTML = createLogoSelect(cur);
      });
    }
    
    // Bei Sprachwechsel: Platzhalter und Logo-Auswahl neu beschriften, Eingaben bleiben erhalten
    window.onLangChange = () => {
      updatePasswordPlaceholder();
      buildLogoSelects();
      document.querySelectorAll('.service-name').forEach(el => el.placeholder = t('settings.name'));
    };
    
    loadConfig();
  </script>
</body>
</html>
